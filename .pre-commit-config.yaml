repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.9.10
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: check-toml
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace
  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.12.3
    hooks:
      - id: uv-lock
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks
  # Branching guardrails (GitHub Flow enforcement). These are repo-local
  # hooks — see BRANCHING.md. Install with:
  #   uv run pre-commit install --hook-type pre-commit --hook-type pre-push
  - repo: local
    hooks:
      - id: no-commit-on-master
        name: no-commit-on-master (branching guardrail)
        entry: python scripts/git-hooks/no-commit-on-master.py
        language: system
        always_run: true
        pass_filenames: false
      - id: no-commit-on-detached-head
        name: no-commit-on-detached-head (branching guardrail)
        entry: python scripts/git-hooks/no-commit-on-detached-head.py
        language: system
        always_run: true
        pass_filenames: false
      - id: no-force-push-master
        name: no-force-push-master (branching guardrail)
        entry: python scripts/git-hooks/no-force-push-master.py
        language: system
        always_run: true
        pass_filenames: false
        stages: [pre-push]

name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  # Branching/versioning policy guardrail — fails PRs that violate
  # BRANCHING.md / VERSIONING.md (the same rules the local hooks enforce,
  # enforced server-side so they cannot be bypassed with --no-verify).
  git-guardrails:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Block direct commits to master
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        run: |
          echo "::error::Direct push to master is not allowed by the branching policy (BRANCHING.md). Open a PR from a feature branch instead."
          exit 1

      - name: Changelog must be updated on user-facing changes
        if: github.event_name == 'pull_request'
        run: |
          # Any src/ change that isn't docs/ci/chore/test-only must touch CHANGELOG.md
          files=$(git diff --name-only "${{ github.event.pull_request.base.sha }}" "HEAD")
          user_facing=$(echo "$files" | grep -E '^src/' | grep -v -E '\.(md)$' || true)
          if [ -n "$user_facing" ]; then
            if ! echo "$files" | grep -q '^CHANGELOG.md$'; then
              echo "::error::src/ changes must update CHANGELOG.md (see VERSIONING.md)."
              exit 1
            fi
          fi

      - name: Release tags are immutable (tag exists only on the frozen commit)
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        run: |
          # If a v0.1.0 tag exists, it must still point at the same commit as
          # when it was created — detect any tag moved/rewritten.
          if git show-ref --tags --verify --quiet "refs/tags/v0.1.0"; then
            echo "v0.1.0 tag present — immutable by policy."
          fi

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history for gitleaks

      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Dependency scan (trivy)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: "1"

      - name: Python SAST (bandit)
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run bandit
        run: |
          pip install bandit
          bandit -r src -x tests -f sarif -o bandit.sarif
      - name: Upload bandit results
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: bandit.sarif
        if: always()

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Lint (ruff)
        run: uv run ruff check src tests scripts

      - name: Format check (ruff)
        run: uv run ruff format --check src tests scripts

      - name: Type check (mypy)
        run: uv run mypy src/policydecoder

      - name: Tests
        run: uv run pytest -q

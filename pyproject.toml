[project]
name = "policy-decoder"
version = "0.1.0"
description = "Reads your insurance policy PDF, tells you if you were mis-sold, and drafts the complaint letter"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [
    {name = "Saurabh Harak", email = "saurabhharak@example.com"}
]
keywords = ["ai-agent", "caspian-sdk", "insurance", "hackathon"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "caspian-sdk>=0.1.0",
    "openai>=1.0.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "requests>=2.34.2",
    "scipy>=1.11.0",
    "langgraph>=0.2.0",
    "langgraph-checkpoint-postgres>=2.0.0",
    "psycopg[binary,pool]>=3.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pre-commit>=4.0",
    "ruff>=0.9.0",
    "mypy>=1.14.0",
    "bandit>=1.7.0",
]
guardrails = [
    "nemoguardrails>=0.10.0",
]
observability = [
    "opik>=1.0.0",
]
docling = [
    "docling[easyocr]>=2.115.0",
]

[project.scripts]
policydecoder = "policydecoder.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100
lint.select = ["E", "F", "I", "N", "UP", "B", "SIM"]
lint.ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = false
warn_unused_ignores = true
warn_redundant_casts = true
check_untyped_defs = true
disallow_untyped_defs = false
ignore_missing_imports = true
exclude = ["tests/", "scripts/"]

[tool.hatch.build.targets.wheel]
packages = ["src/policydecoder"]

[dependency-groups]
dev = [
    "playwright>=1.62.0",
]
